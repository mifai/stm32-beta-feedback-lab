name: Proving Finding
description: Report a reusable finding from a proving repository or beta run.
title: "[finding] "
labels:
  - proving
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this form for findings that may matter beyond one local project.
  - type: input
    id: project
    attributes:
      label: Project
      description: Name of the proving or beta project.
      placeholder: STM32TestProject2
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
      placeholder: Describe the observed problem or friction.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What were you trying to do when this happened?
      placeholder: Include workflow step, command, hardware context, and prerequisites.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include error text, paths, screenshots, or artifacts.
      placeholder: Paste the most useful concrete evidence.
    validations:
      required: true
  - type: textarea
    id: generic
    attributes:
      label: Why it may be generic
      description: Why do you think this is not just a one-off local issue?
      placeholder: This looks reusable because...
    validations:
      required: true
  - type: dropdown
    id: retest
    attributes:
      label: Retest status
      options:
        - Not retested yet
        - Retested and still reproducible
        - Retested and no longer reproducible
    validations:
      required: true
